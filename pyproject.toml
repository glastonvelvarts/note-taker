[project]
name = "note-taker"
version = "0.1.0"
description = "Google Meet bot that joins calls, transcribes them live and summarizes the transcript"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "glastonvelvarts" }]
requires-python = ">=3.10"
keywords = ["google-meet", "transcription", "speech-to-text", "meeting-notes", "deepgram", "whisper", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "openai>=1.60",
    "playwright>=1.61.0",
    "playwright-stealth>=2.0.3",
    "python-dotenv>=1.0",
    "webrtcvad-wheels>=2.0.14",
    "websockets>=16.1",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.2.1",
    "onnxruntime<1.24",
]

[project.scripts]
note-taker = "note_taker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
